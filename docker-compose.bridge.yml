# Bridge networking instead of host networking, for Docker Desktop or for
# anyone who wants the ports mapped explicitly.
#
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up --build
#
# The one thing this costs is LAN auto-discovery: the beacon is a UDP
# broadcast, and broadcast does not cross a bridge, so phones will not see the
# server in their Join Game list. Players enter the address by hand instead.

services:
  server:
    network_mode: bridge
    environment:
      LAN_DISCOVERY: "0"
    ports:
      - "${GAME_PORT:-45678}:45678/tcp"

  web:
    network_mode: bridge
    ports:
      - "${WEB_PORT:-8080}:8080/tcp"
